<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Nova-X Blockchain</title>
    <link rel="stylesheet" href="/index/CSS/index.css">
</head>
<body>
    <!-- ==================== Página de login ==================== -->
    <div id="login-page" class="container login-container"> 
        <div class="card">
            <div class="content"></div>
            <!-- Logo centralizada -->
            <center>
                <img src="/LogoFundo.png" alt="Logo Nova-X" width="50%" height="50%">
            </center>
            <h2>Seja Bem-vindo ao Nova-X</h2>
            <form id="login-form">
                <!-- Input usuário -->
                <div class="form-group">
                    <label for="username">CPF</label>
                    <input type="text" id="username" name="username" required placeholder="Digite seu CPF" inputmode="numeric" maxlength="14">
                </div>
                <!-- Input senha -->
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="password-container">
                        <input id="password" name="password" type="password" required placeholder="Senha" autocomplete="new-password">
                        <i id="eye-icon" class="fas fa-eye eye-icon" onclick="togglePassword()"></i>
                    </div>
                </div>
                <!-- Botão entrar -->
                <button type="submit" class="btn btn-success">Entrar</button>
                <!-- Links de recuperação e cadastro -->
            <div class="auth-links">
                <h4><a href="/recuperar/recuperar.html">Esqueci Minha Senha</a></h4>
                <h4><a href="/cadastro/cadastro.html">Cadastrar-se</a></h4>
            </div>
            </form>
        </div>
    </div>

    <!-- ==================== Aplicação principal ==================== -->
    <div id="app" class="hide">
        <header>
            <div class="container">
                <!-- Logo -->
                <div class="logo">Nova<span>X</span></div>
                <!-- Informações e logout -->
                <div class="auth-info">
                    <div class="user-info">Olá, <span id="user-name">Usuário</span></div>
                    <div class="user-balance"><span id="balance-amount">0</span> NovaX</div>
                    <button id="logout-btn" class="btn btn-danger">Sair</button>
                </div>
            </div>
        </header>

        <div class="container">
            <main>
                <!-- Coluna esquerda -->
                <div class="left-column">
                    <!-- Card para enviar NovaX -->
                    <div class="card">
                        <h2>Enviar NovaX</h2>
                        <form id="transaction-form">
                            <div class="form-group">
                                <label for="receiver">Destinatário</label>
                                <input type="text" id="receiver" name="receiver" required placeholder="Nome do usuário destinatário">
                            </div>
                            <div class="form-group">
                                <label for="amount">Quantidade</label>
                                <input type="number" id="amount" name="amount" min="0.01" step="0.01" required placeholder="Quantidade de NovaX">
                            </div>
                            <button type="submit" class="btn btn-success">Enviar</button>
                        </form>
                    </div>

                    <!-- Card para listar transações do usuário -->
                    <div class="card">
                        <h2>Minhas Transações</h2>
                        <div id="user-transactions" class="transaction-list">
                            <div class="loader" id="transactions-loader"></div>
                        </div>
                    </div>
                </div>

                <!-- Coluna direita -->
                <div class="right-column">
                    <!-- Card Blockchain -->
                    <div class="card">
                        <h2>Blockchain</h2>
                        <div id="blockchain-info" class="blockchain-info">
                            <div class="loader" id="blockchain-loader"></div>
                        </div>
                    </div>

                    <!-- Card Estatísticas -->
                    <div class="card">
                        <h2>Estatísticas</h2>
                        <div id="stats">
                            <div class="form-group">
                                <label>Total de Blocos:</label>
                                <span id="total-blocks">0</span>
                            </div>
                            <div class="form-group">
                                <label>Total de Usuários:</label>
                                <span id="total-users">0</span>
                            </div>
                            <div class="form-group">
                                <label>Total de Transações:</label>
                                <span id="total-transactions">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer>
        &copy; 2025 Nova-X. Todos os direitos reservados.
    </footer>

    <script src="/index/JS/index.js"></script>
    <script src="/js/blockchain.js"></script>
</body>
</html>
